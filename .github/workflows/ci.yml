name: CI

on:
  push:
    branches: [main, gestion]
  pull_request:
    branches: [main, gestion]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://mindbridge-backend:4000

  build-and-push:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BACKEND_INTERNAL_URL=http://mindbridge-backend:4000
          tags: |
            tcordoba24/mindbridge-frontend:latest
            tcordoba24/mindbridge-frontend:${{ github.sha }}
